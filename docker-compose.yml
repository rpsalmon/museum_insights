services:
  postgres:
    image: postgres:16-alpine
    container_name: museum_insights_pg
    environment:
      POSTGRES_USER: museum
      POSTGRES_PASSWORD: museum_dev_only
      POSTGRES_DB: museum_insights
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
